services:
  # 1 - Persistent Postgres DB
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: totallysecurepassword
      POSTGRES_DB: flaggo

  # 2 - Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      STORE: postgres
      DATABASE_URL: postgres://admin:totallysecurepassword@postgres:5432/flaggo?sslmode=disable
      PORT: "8080"
    depends_on:
      - postgres

  # 3 - Frontend webapp
  flaggo-frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      PORT: "8080"
      BACKEND_URL: http://flaggo-backend:8080
    ports:
      - "8080:8080" # ONLY port that gets opened to the host machine. Backend does not open any
    depends_on:
      - postgres

  # 4 - Client (simulates API user)
  flaggo-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      CONTROL_PLANE_URL: http://flaggo-backend:8080
    depends_on:
      - backend  
