# Flaggo — local 4-app stack.
#
#   frontend : Control Plane dashboard + API gateway  -> PUBLISHED on the host
#   api      : Control Plane Backend Web API             -> private
#   client   : Data Plane client / evaluator (worker)    -> private
#   db       : PostgreSQL                                -> private
#
# Port-exposure rule (deliberate, and enforced by a test):
#   ONLY the frontend publishes a host port. The api, client and db are
#   reachable exclusively on the internal "flaggo" bridge network.
#   `expose:` documents the internal port; it does NOT bind to the host.
#
#   docker compose up --build          # start everything
#   docker compose ps                  # see status
#   docker compose logs -f client      # watch the data plane poll
#   docker compose down                # stop (keeps the db volume)
#   docker compose down -v             # stop and wipe the db volume
#
# Nothing here is production-ready by design: passwords are literals and the
# images are built locally. This file is a development/teaching artifact.

name: flaggo

services:
  # ------------------------------------------------------- frontend (public)
  frontend:
    build:
      context: .
      target: frontend
    image: flaggo/frontend:dev
    # THE ONLY service with a host-published port.
    ports:
      - "${FLAGGO_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # Service-name DNS on the internal network — no host port involved.
      BACKEND_URL: "http://api:8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - flaggo
    restart: unless-stopped

  # ------------------------------------------------------------- api (private)
  api:
    build:
      context: .
      target: api
    image: flaggo/api:dev
    environment:
      PORT: "8080"
      STORE: "postgres"
      DATABASE_URL: "postgres://flaggo:flaggo@db:5432/flaggo?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      db:
        condition: service_healthy
    # `expose` is documentation only. There is deliberately no `ports:` key:
    # the API is reachable only from inside the flaggo network.
    expose:
      - "8080"
    networks:
      - flaggo
    restart: unless-stopped

  # ---------------------------------------------------------- client (private)
  client:
    build:
      context: .
      target: client
    image: flaggo/client:dev
    environment:
      # Talks straight to the api over the private network.
      CONTROL_PLANE_URL: "http://api:8080"
      POLL_INTERVAL: "5s"
      FLAG_NAME: "${FLAG_NAME:-new-checkout}"
      USER_KEY: "${USER_KEY:-demo-user}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - flaggo
    restart: unless-stopped

  # ---------------------------------------------------------------- db (private)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-flaggo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-flaggo}"
      POSTGRES_DB: "${POSTGRES_DB:-flaggo}"
    volumes:
      - flaggo-db:/var/lib/postgresql/data
    # The image's own pg_isready — no extra tooling in the container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flaggo} -d ${POSTGRES_DB:-flaggo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # No `ports:` — the database is never published to the host.
    networks:
      - flaggo
    restart: unless-stopped

volumes:
  flaggo-db:

networks:
  flaggo:
    driver: bridge
